name: Bug report
description: Report apply, verify, rollback, or startup problems
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove private paths, account info, tokens, and API keys before posting logs.
  - type: input
    id: antigravity-version
    attributes:
      label: Antigravity version
      placeholder: "Example: 2.0.1"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "Example: v25.2.1"
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Which command failed?
      placeholder: "npm run apply"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the relevant output.
      render: shell
    validations:
      required: true

